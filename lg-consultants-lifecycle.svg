<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="260" viewBox="0 0 1240 260" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1240" height="260" fill="#ffffff"/>
  <text x="620" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Consultant Project Lifecycle</text>

  <g font-size="13" text-anchor="middle">
    <!-- 1 -->
    <rect x="20" y="70" width="170" height="150" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="105" y="100" font-size="16" font-weight="700" fill="#0f172a">1. Request</text>
    <text x="105" y="130" fill="#334155">Project approved</text>
    <text x="105" y="150" fill="#334155">Consultants named</text>
    <text x="105" y="170" fill="#334155">End date set</text>
    <!-- 2 -->
    <rect x="225" y="70" width="170" height="150" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="310" y="100" font-size="16" font-weight="700" fill="#1e3a8a">2. Onboard</text>
    <text x="310" y="130" fill="#1e3a8a">Create secret team</text>
    <text x="310" y="150" fill="#1e3a8a">Create private repo</text>
    <text x="310" y="170" fill="#1e3a8a">Invite consultants</text>
    <!-- 3 -->
    <rect x="430" y="70" width="170" height="150" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="515" y="100" font-size="16" font-weight="700" fill="#1e3a8a">3. Work</text>
    <text x="515" y="130" fill="#1e3a8a">Consultants see</text>
    <text x="515" y="150" fill="#1e3a8a">only their</text>
    <text x="515" y="170" fill="#1e3a8a">project repo</text>
    <!-- 4 -->
    <rect x="635" y="70" width="170" height="150" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="720" y="100" font-size="16" font-weight="700" fill="#14532d">4. Handover</text>
    <text x="720" y="130" fill="#14532d">Transfer repo to</text>
    <text x="720" y="150" fill="#14532d">permanent org</text>
    <text x="720" y="170" fill="#14532d">History preserved</text>
    <!-- 5 -->
    <rect x="840" y="70" width="170" height="150" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="925" y="100" font-size="16" font-weight="700" fill="#7f1d1d">5. Offboard</text>
    <text x="925" y="130" fill="#7f1d1d">Remove consultants</text>
    <text x="925" y="150" fill="#7f1d1d">Revoke keys/tokens</text>
    <text x="925" y="170" fill="#7f1d1d">Rotate secrets</text>
    <!-- 6 -->
    <rect x="1045" y="70" width="170" height="150" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="1130" y="100" font-size="16" font-weight="700" fill="#0f172a">6. Audit</text>
    <text x="1130" y="130" fill="#334155">Export audit log</text>
    <text x="1130" y="150" fill="#334155">Delete project team</text>
  </g>

  <g stroke="#475569" stroke-width="2" marker-end="url(#arr)">
    <line x1="190" y1="145" x2="221" y2="145"/>
    <line x1="395" y1="145" x2="426" y2="145"/>
    <line x1="600" y1="145" x2="631" y2="145"/>
    <line x1="805" y1="145" x2="836" y2="145"/>
    <line x1="1010" y1="145" x2="1041" y2="145"/>
  </g>
</svg>
